server {
    # `listen ... http2` was deprecated in nginx 1.25.1 and is ignored by the
    # 1.27 running in production, which is why the site was still negotiating
    # HTTP/1.1 — Lighthouse put that at ~920ms, the largest single item it found.
    listen 443 ssl;
    http2 on;
    server_name soominlab.com;

    ssl_certificate /etc/letsencrypt/live/soominlab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soominlab.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/case-studies-access.log;
    error_log /var/log/nginx/case-studies-error.log;

    # No security headers here. They come from the app — the static ones from
    # next.config.ts, the per-request Content-Security-Policy from proxy.ts —
    # so that they ship with the image and cannot be lost when this file is
    # copied onto the server by hand. That copy had in fact fallen behind: the
    # headers declared here were reaching nobody in production.
    #
    # Declaring them in both places would be worse than either alone. Two
    # Content-Security-Policy headers are enforced as their intersection, so
    # editing one and forgetting the other tightens the policy silently and
    # breaks the page with no obvious cause.

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # No block for /_next/static/: Next already serves those hashed files as
    # `public, max-age=31536000, immutable`, and adding the same header here
    # would only send it twice. They fall through to location / above.
    #
    # No block for /static/ either — nothing serves that path under the App
    # Router, and nothing in the site links to it.

    # Self-hosted RDKit.js (public/rdkit/, generated by scripts/copy-rdkit.mjs).
    # Next serves the public folder as max-age=0. The bytes are not re-sent — the
    # ETag makes a repeat visit a 304 — but the browser still has to ask before it
    # may use either file, and it only requests the .wasm once the .js has
    # answered. Measured against production that is two serial round-trips of
    # ~130ms, sitting in front of the RDKit render. proxy_hide_header comes first,
    # or the client receives two conflicting Cache-Control headers.
    #
    # A day, not a year with immutable: these filenames carry no content hash, so
    # an immutable policy would pin a stale build to the same URL after a version
    # bump. A day drops the round-trips for returning readers and costs at most a
    # day of staleness after a version bump.
    location /rdkit/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
    }
}

# www → apex (keeps one canonical hostname for links shared from platforms)
server {
    listen 443 ssl;
    http2 on;
    server_name www.soominlab.com;

    ssl_certificate /etc/letsencrypt/live/soominlab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soominlab.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://soominlab.com$request_uri;
}

# HTTP redirect
server {
    listen 80;
    server_name soominlab.com www.soominlab.com;
    return 301 https://soominlab.com$request_uri;
}