server {
    listen 443 ssl http2;
    server_name soominlab.com;

    ssl_certificate /etc/letsencrypt/live/soominlab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soominlab.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/case-studies-access.log;
    error_log /var/log/nginx/case-studies-error.log;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Self-hosted RDKit.js (public/rdkit/, generated by scripts/copy-rdkit.mjs).
    # Next serves the public folder as max-age=0, which would re-download ~2.5 MB
    # of WASM on every visit, so the policy is set here instead — proxy_hide_header
    # first, or the client receives two conflicting Cache-Control headers.
    #
    # A day, not a year with immutable: these filenames carry no content hash, so
    # an immutable policy would pin a stale build to the same URL after a version
    # bump. A day still spares returning readers the download.
    location /rdkit/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;

        # A location with any add_header of its own drops every server-level
        # header, so the security headers have to be repeated here verbatim.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

# www → apex (keeps one canonical hostname for links shared from platforms)
server {
    listen 443 ssl http2;
    server_name www.soominlab.com;

    ssl_certificate /etc/letsencrypt/live/soominlab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soominlab.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://soominlab.com$request_uri;
}

# HTTP redirect
server {
    listen 80;
    server_name soominlab.com www.soominlab.com;
    return 301 https://soominlab.com$request_uri;
}