<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Before-and-after route-to-chunk diagram showing bundle savings">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
  </style>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Simplified route-to-chunk diagram (before / after)</text>

  <!-- BEFORE section -->
  <text x="200" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">Before</text>

  <!-- Route labels -->
  <text x="40" y="95" font-size="11" fill="#6b7280">Route A</text>
  <text x="40" y="125" font-size="11" fill="#6b7280">Route B</text>
  <text x="40" y="155" font-size="11" fill="#6b7280">Route C</text>
  <text x="40" y="185" font-size="11" fill="#6b7280">Route D</text>

  <!-- Chunk representation: each route has full chunk -->
  <rect x="100" y="82" width="280" height="18" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <rect x="100" y="112" width="280" height="18" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <rect x="100" y="142" width="280" height="18" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <rect x="100" y="172" width="280" height="18" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>

  <!-- Shared library label -->
  <text x="240" y="76" text-anchor="middle" font-size="9" fill="#dc2626">Full scientific lib (RDKit + Molstar + Plotly)</text>

  <!-- Size labels -->
  <text x="390" y="95" font-size="10" fill="#6b7280" font-variant-numeric="tabular-nums">~30 MB</text>
  <text x="390" y="125" font-size="10" fill="#6b7280" font-variant-numeric="tabular-nums">~30 MB</text>
  <text x="390" y="155" font-size="10" fill="#6b7280" font-variant-numeric="tabular-nums">~30 MB</text>
  <text x="390" y="185" font-size="10" fill="#6b7280" font-variant-numeric="tabular-nums">~30 MB</text>

  <!-- Divider -->
  <line x1="420" y1="65" x2="420" y2="200" stroke="#d1d5db" stroke-dasharray="4,3" stroke-width="1"/>

  <!-- AFTER section -->
  <text x="610" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#059669">After</text>

  <!-- Route A: small + viewer -->
  <rect x="440" y="82" width="40" height="18" rx="3" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
  <rect x="485" y="82" width="100" height="18" rx="3" fill="#a7f3d0" stroke="#34d399" stroke-width="1"/>
  <text x="505" y="72" font-size="8" fill="#059669" text-anchor="middle">viewer</text>
  <text x="590" y="95" font-size="10" fill="#6b7280" font-variant-numeric="tabular-nums">~7 MB</text>

  <!-- Route B: small + plot -->
  <rect x="440" y="112" width="40" height="18" rx="3" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
  <rect x="485" y="112" width="70" height="18" rx="3" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="520" y="102" font-size="8" fill="#d97706" text-anchor="middle">plot</text>
  <text x="590" y="125" font-size="10" fill="#6b7280" font-variant-numeric="tabular-nums">~6 MB</text>

  <!-- Route C: small + chem -->
  <rect x="440" y="142" width="40" height="18" rx="3" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
  <rect x="485" y="142" width="80" height="18" rx="3" fill="#e0e7ff" stroke="#818cf8" stroke-width="1"/>
  <text x="525" y="132" font-size="8" fill="#6366f1" text-anchor="middle">chem</text>
  <text x="590" y="155" font-size="10" fill="#6b7280" font-variant-numeric="tabular-nums">~6.5 MB</text>

  <!-- Route D: all three -->
  <rect x="440" y="172" width="40" height="18" rx="3" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
  <rect x="485" y="172" width="130" height="18" rx="3" fill="#d1fae5" stroke="#34d399" stroke-width="1"/>
  <text x="550" y="162" font-size="8" fill="#059669" text-anchor="middle">viewer + chem + plot</text>
  <text x="630" y="185" font-size="10" fill="#6b7280" font-variant-numeric="tabular-nums">~9 MB</text>

  <!-- Shared base -->
  <rect x="440" y="200" width="180" height="14" rx="2" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="530" y="210" text-anchor="middle" font-size="8" fill="#6b7280">shared base (~0.5 MB)</text>

  <!-- Caption -->
  <text x="400" y="245" text-anchor="middle" font-size="10" fill="#9ca3af">Simplified reconstruction; not a production screenshot. Route names and chunk sizes anonymized.</text>

  <!-- Legend -->
  <g transform="translate(250, 270)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
    <text x="20" y="11" font-size="10" fill="#374151">Shared framework</text>
    <rect x="130" y="0" width="14" height="14" rx="2" fill="#a7f3d0" stroke="#34d399" stroke-width="1"/>
    <text x="150" y="11" font-size="10" fill="#374151">Molstar (3D viewer)</text>
    <rect x="290" y="0" width="14" height="14" rx="2" fill="#e0e7ff" stroke="#818cf8" stroke-width="1"/>
    <text x="310" y="11" font-size="10" fill="#374151">RDKit (chemistry)</text>
    <rect x="0" y="22" width="14" height="14" rx="2" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
    <text x="20" y="33" font-size="10" fill="#374151">react-plotly.js</text>
  </g>
</svg>